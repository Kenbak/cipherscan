name: Security audit

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly re-scan so newly disclosed CVEs surface even without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-changes:
    name: Detect dependency changes
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.changes.outputs.npm }}
      rust: ${{ steps.changes.outputs.rust }}
      python: ${{ steps.changes.outputs.python }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha="${PR_BASE_SHA:-$BEFORE_SHA}"
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${base_sha}^{commit}"; then
            echo "Unable to resolve comparison base; running every dependency audit."
            echo "npm=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base_sha" "${GITHUB_SHA}")"
          if grep -Eq '(^|/)package(-lock)?\.json$' <<< "$changed"; then echo "npm=true" >> "$GITHUB_OUTPUT"; else echo "npm=false" >> "$GITHUB_OUTPUT"; fi
          if grep -Eq '^wasm/Cargo\.(toml|lock)$' <<< "$changed"; then echo "rust=true" >> "$GITHUB_OUTPUT"; else echo "rust=false" >> "$GITHUB_OUTPUT"; fi
          if grep -Eq '^server/jobs/requirements[^/]*\.txt$' <<< "$changed"; then echo "python=true" >> "$GITHUB_OUTPUT"; else echo "python=false" >> "$GITHUB_OUTPUT"; fi

  # ---------------------------------------------------------------------------
  # npm audit across every package.json in the repo
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    needs: dependency-changes
    if: needs.dependency-changes.outputs.npm == 'true'
    # The inherited root advisory backlog is cleared; high and critical npm
    # findings now gate the PR instead of being report-only.
    strategy:
      fail-fast: false
      matrix:
        dir:
          - "."
          - "server/api"
          - "server/indexer"
          - "packages/zcash-decoder"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Audit (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        # high+critical fail the build; lower severities are reported only.
        # Every package now commits its lockfile. Audit that exact dependency
        # graph instead of mutating it on the runner before the check.
        run: |
          for attempt in 1 2 3; do
            set +e
            output="$(npm audit --audit-level=high 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"

            if (( status == 0 )); then
              exit 0
            fi

            if printf '%s' "$output" | grep -Eq \
              '503 Service Unavailable|502 Bad Gateway|429 Too Many Requests|EAI_AGAIN|ECONNRESET|audit endpoint returned an error'; then
              if (( attempt < 3 )); then
                sleep $(( attempt * 5 ))
                continue
              fi
            fi

            # A real advisory failure is not transient and must remain fatal.
            exit "$status"
          done

  # ---------------------------------------------------------------------------
  # Rust dependency audit (RUSTSEC advisories)
  # ---------------------------------------------------------------------------
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    needs: dependency-changes
    if: needs.dependency-changes.outputs.rust == 'true'
    # Report-only: the WASM crate cannot resolve a fresh lockfile (orchard
    # 0.11.0 -> yanked core2 ^0.3), so cargo-audit cannot build the graph.
    # Unblocks once the orchard bump + committed Cargo.lock land.
    continue-on-error: true
    defaults:
      run:
        working-directory: wasm
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.0
      - name: Install cargo-audit when not cached
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version 0.22.0 --locked
      - name: Generate lockfile if missing
        run: test -f Cargo.lock || cargo generate-lockfile
      - name: Audit
        run: cargo audit

  # ---------------------------------------------------------------------------
  # Python dependency audit
  # ---------------------------------------------------------------------------
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: dependency-changes
    if: needs.dependency-changes.outputs.python == 'true'
    defaults:
      run:
        working-directory: server/jobs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------------------
  # Secret scanning (TruffleHog) - repo ships a .trufflehogignore already
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
