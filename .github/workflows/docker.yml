name: Docker

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint every Dockerfile with hadolint
  # ---------------------------------------------------------------------------
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
          hadolint --version
      - name: Lint Dockerfiles
        run: hadolint --config .hadolint.yaml Dockerfile server/api/Dockerfile docker/zebra/Dockerfile

  # ---------------------------------------------------------------------------
  # Build the application images (web + api). No push.
  # ---------------------------------------------------------------------------
  build:
    name: Build image (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: hadolint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: Dockerfile
          - name: api
            context: server/api
            dockerfile: server/api/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: cipherscan-${{ matrix.name }}:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_NETWORK=mainnet
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
      - name: Smoke-test API image startup and liveness
        if: matrix.name == 'api'
        run: |
          docker run --detach --rm --name cipherscan-api-smoke -p 3001:3001 cipherscan-api:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null; then
              exit 0
            fi
            if ! docker inspect cipherscan-api-smoke >/dev/null 2>&1; then
              echo "API container exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done
          docker logs cipherscan-api-smoke
          exit 1
      - name: Stop API smoke-test container
        if: always() && matrix.name == 'api'
        run: docker stop cipherscan-api-smoke >/dev/null 2>&1 || true
