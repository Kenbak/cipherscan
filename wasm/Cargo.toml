[package]
name = "zcash-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM essentials
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Zakura Common — optimized Zcash cryptography (1.5x faster trial decrypt)
# Only zakura-orchard is used; zakura-primitives is excluded because it pulls
# secp256k1 (C code) via zcash_transparent, which cannot compile to wasm32.
# Transaction parsing is handled by a minimal ZIP-225 v5 parser instead.
orchard = { package = "zakura-orchard", version = "1.0", default-features = false, features = ["std"] }

# Note encryption interface (stays upstream per Zakura guidance)
zcash_note_encryption = "0.4"

subtle = "2.6"

# Encoding
hex = "0.4"
bech32 = "0.11"
bs58 = { version = "0.5", features = ["check"] }

# Zcash address parsing (for UFVK)
zcash_address = "0.13"
zcash_protocol = "0.10"

[dependencies.web-sys]
version = "0.3"
features = ["console"]

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce parallel codegen units
