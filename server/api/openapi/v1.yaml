info:
  title: CipherScan API v1
  version: 1.0.0-preview
  summary: >-
    Versioned, contract-stable read/write API for the Zcash blockchain data and privacy-intelligence
    features exposed by CipherScan.
  description: >-
    This is the v1 contract layer. It is gated behind API_V1_ENABLED and, pre-launch, an
    X-API-Preview-Key header (see the previewKey security scheme) — see server/api/v1/README.md in
    the repository for exact mount instructions and current caveats. Every success response uses the
    {data, meta} envelope; every error response is an RFC 9457 problem+json document. Every public
    inventory entry is adapted; private, internal, operational, and deprecated surfaces are
    excluded.
  contact:
    name: CipherScan / Atmosphere Labs
